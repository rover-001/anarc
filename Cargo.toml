[workspace]
members = [".", "crates/anarc-telemetry"]
resolver = "3"

[package]
name = "anarc"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "anarc"
path = "src/main.rs"

[[bin]]
name = "anarc-ctl"
path = "src/bin/anarc_ctl.rs"

[features]
default = []
wasm-plugins = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:url"]

[dependencies]
gpui-kit = "=0.9.0"
cef = "=156.4.0"
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
anarc-telemetry = { path = "crates/anarc-telemetry" }
toml = "=0.8.23"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
smallvec = "=1.16.5"
async-channel = "=2.5.0"
futures-lite = "=2.6.1"
adblock = "=0.13.5"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
ring = "=0.17.14"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "wat"], optional = true }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2"], optional = true }
url = { version = "=2.5.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "=2.21.0", features = ["xlib"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "none"
debug = 1

[profile.release.package."*"]
opt-level = 3


[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
