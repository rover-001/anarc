[package]
name = "lumen"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "=0.9.0"
cef = "=156.4.0"
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
x11 = { version = "=2.21.0", features = ["xlib"] }
image = "=0.25.10"
smallvec = "=1.16.5"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
