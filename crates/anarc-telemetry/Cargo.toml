[package]
name = "anarc-telemetry"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Opt-in, privacy-safe daily rollup telemetry for Anarc agent control"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
